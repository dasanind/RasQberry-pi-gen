name: Rasqberry Pi Image Release

on:
   push:
     branches:
       - 30-sw-platform
   workflow_dispatch:
     inputs:
       version:
         type: string
         description: New version number in X.Y.Z
         required: false
         default: ''

jobs:
  rasqberry-push-version-number:
    name: "Rasqberry: Push version number"
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.current-version.outputs.version }}
    steps:
      - name: "Rasqberry: Clone Repository"
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true
#          ref: "30-sw-platform"

      - name: Create Date
        id: create-date
        if: always()
        shell: bash
        run: |
          NOW="$(date +"%Y-%m-%d")"
          echo "date=${NOW}" >> $GITHUB_OUTPUT
      - run: |
          echo "${{ steps.create-date.outputs.date }}"

      - name: "Rasqberry: Get current version"
        id: current-version
        shell: bash
        run: |
          version=$(cat ./src/version)
          echo "version=${version}" >> $GITHUB_OUTPUT

      - run: |
          echo "${{ steps.current-version.outputs.version }}"

      - name: "Rasqberry: Add version file"
        if: steps.current-version.outputs.version != github.event.inputs.version
        shell: bash
        run: |
          if [ -z ${{ github.event.inputs.version }} ]; then
            echo "version_num="alpha-"${{ steps.create-date.outputs.date }}" >> $GITHUB_ENV
            echo ${{env.version_num}} > ./src/version
#            echo "alpha-"${{ steps.create-date.outputs.date }} > ./src/version
          else
#            echo ${{ github.event.inputs.version }} > ./src/version
            echo "version_num="a${{ github.event.inputs.version }}" >> $GITHUB_ENV
            echo ${{env.version_num}} > ./src/version
          fi
#          echo ${{ github.event.inputs.version || ${{ steps.create-date.outputs.date
#          }}}} > ./src/version

      - name: "Rasqberry: git add & commit & tag & push"
        uses: EndBug/add-and-commit@v9
        with:
          add: "./src/version"
          default_author: github_actions
          message: "Bump version to v${{ github.event.inputs.version }}"
          github_token: ${{ secrets.GITHUB_TOKEN }}
          tag: "v${{ github.event.inputs.version }} --force"
          tag_push: "--force"
          push: true

      # Install the cosign tool except on PR
      # https://github.com/sigstore/cosign-installer
      - name: Install cosign
        uses: sigstore/cosign-installer@v3.5.0
        with:
          cosign-release: 'v2.2.4'
      - name: Check install!
        run: cosign version

  release:
    name: Create Release
    needs: rasqberry-push-version-number
    runs-on: ubuntu-latest
    outputs:
      id: ${{ steps.create-release.outputs.id }}
#      date: ${{ steps.base-name.outputs.date }}
      upload_url: ${{ steps.create-release.outputs.upload_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # ref: "v2.1.x"
          fetch-depth: 0

      - name: Get latest tag
        id: latest_tag
        shell: bash
        run: |
          echo "TAG_NAME=$(git describe --tags $(git rev-list --tags --max-count=1))" >> $GITHUB_OUTPUT

      - run: |
          echo "${{ steps.latest_tag.outputs.TAG_NAME }}"      

      - name: Print branch details
        id: branch-details
        shell: bash
        run: |
          echo "branch_name=$(git branch --show-current)" >> $GITHUB_OUTPUT
      - run: |
          echo "${{ steps.branch-details.outputs.branch_name }}"

      - name: Generate a changelog
        uses: orhun/git-cliff-action@v1
        id: changelog
        with:
          config: ./cliff-release.toml
          args: ${{ steps.latest_tag.outputs.TAG_NAME }}..HEAD

      - name: Create empty release
        id: create-release
        uses: softprops/action-gh-release@v2.2.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          name: "rasqberry-v${{ github.event.inputs.version }}"
          tag_name: v${{ github.event.inputs.version }}
          body: ${{ steps.changelog.outputs.content }}
          make_latest: true
      - run: |
          echo "${{ steps.create-release.outputs.upload_url }}"

  build:
    name: Build Image
    needs: [release]
    runs-on: ubuntu-latest
#    outputs:
#      base_name: ${{ steps.move-image.outputs.base_name }}
#    strategy:
#      fail-fast: false
#      matrix:
#        config: ${{ fromJson(needs.matrix.outputs.matrix) }}

    steps:
      - name: Start build with raspiconfig
        uses: usimd/pi-gen-action@v1
        id: pi-gen-build
        with:
#          config: ${{ matrix.config }}
          apt-proxy: ''
          compression: xz
          compression-level: 8
          disable-first-boot-user-rename: 0
          pi-gen-repository: ${{ github.repository }}
          pi-gen-version: arm64
          docker-opts: ''
          enable-noobs: false
          enable-ssh: 0
          export-last-stage-only: true
          extra-host-dependencies: ''
          extra-host-modules: ''
          github-token: ${{ secrets.GITHUB_TOKEN }}
          hostname: raspberrypi
          image-name: 'rasqberry-two'
          increase-runner-disk-size: true
          keyboard-keymap: gb
          keyboard-layout: English (UK)
          locale: en_GB.UTF-8
          password: 'Qiskit1!'
          pi-gen-release: Raspberry Pi Qiskit Release
          pubkey-only-ssh: 0
          stage-list: stage0 stage1 stage2 stage3 stage4 stage5
          timezone: Europe/London
          verbose-output: true

      - name: Set dynamic asset path and name
#        id: set-output
        run: |
          mkdir -p deploy
          # Copy the image to the deploy folder
          cp ${{ steps.pi-gen-build.outputs.image-path }} deploy/
          # Find the file dynamically in the 'deploy' directory
          FILE_PATH=$(find deploy -type f -name "*.img.xz" | head -n 1)
          FILE_NAME=$(basename "${{steps.pi-gen-build.outputs.image-path}}")
          echo "asset_path=$FILE_PATH" >> $GITHUB_ENV
          echo "asset_name=$FILE_NAME" >> $GITHUB_ENV

      - name: Upload Release Asset to Target Repository
        uses: actions/upload-release-asset@v1
        with:
          upload_url: ${{needs.release.outputs.upload_url}}
          asset_path: ${{env.asset_path}}
          asset_name: ${{env.asset_name}}
          asset_content_type: application/x-xz
        env:
          GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
