#### NOTE: Use entries according to their directory/file structure in 'config'
####       e.g. raspberry/rpi32 armbian/orangepi3lts ...

# Use this categories to configure behaviour on pushes/pull requests against
# develop branch
# Each entry will be used in setup matrix

#buildtest:
#  # Raspberry Pi OS based images
#  - raspberry/rpi32

# This is used to setup release build chain.
# Each entry will be used in setup matrix for releases

release:
  # arm64 based images
  - apt-proxy: ''
  - compression: xz
  - compression-level: 8
  - disable-first-boot-user-rename: 0
  - pi-gen-repository: dasanind/RasQberry-pi-gen
  - pi-gen-version: arm64
  - docker-opts: ''
  - enable-noobs: false
  - enable-ssh: 0
  - export-last-stage-only: true
  - extra-host-dependencies: ''
  - extra-host-modules: ''
  - github-token: ${{ secrets.SECRET_GITHUB_TOKEN }}
  - hostname: raspberrypi
  - image-name: 'rasqberry-two'
  - increase-runner-disk-size: true
  - keyboard-keymap: gb
  - keyboard-layout: English (UK)
  - locale: en_GB.UTF-8
  - password: 'Qiskit1!'
  - pi-gen-release: Raspberry Pi Qiskit Release
  - pubkey-only-ssh: 0
  - stage-list: stage0 stage1 stage2 stage3 stage4 stage5
  - timezone: Europe/London
  - verbose-output: true
